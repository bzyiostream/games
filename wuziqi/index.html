<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>五子棋 · 移动优化版</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #2b5a3a 0%, #1d3e2a 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        .game-container {
            max-width: 600px;
            width: 100%;
            background: #e8d5b5;
            background-image: radial-gradient(circle at 25% 30%, #f0e3ce, #dac8a4);
            border-radius: 36px 36px 28px 28px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 1px 6px #fff3d6;
            padding: 18px 12px 22px;
            border: 2px solid #b49a67;
        }
        h1 {
            text-align: center;
            margin: 0 0 6px 0;
            font-weight: 400;
            font-size: 2rem;
            letter-spacing: 6px;
            color: #2f2216;
            text-shadow: 2px 2px 0 #c9ad7a, 4px 4px 0 #6b4f32;
            font-family: 'Trebuchet MS', 'KaiTi',楷体,serif;
        }
        .status-bar {
            background: #493624;
            border-radius: 60px;
            padding: 10px 16px;
            margin: 8px 0 12px;
            color: #eedbba;
            font-size: 1.4rem;
            font-weight: 600;
            text-align: center;
            box-shadow: inset 0 2px 5px #1f130b, 0 5px 0 #2b1c12;
            border-bottom: 2px solid #7d5f44;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .turn-indicator {
            background: #5f4633;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #f5e1c4;
            box-shadow: inset 0 -2px 0 #312419;
        }
        .restart-btn {
            background: #cfa668;
            border: none;
            font-size: 1.2rem;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: #262216;
            box-shadow: 0 5px 0 #7b583b, 0 6px 10px black;
            cursor: pointer;
            transition: all 0.08s linear;
            border: 1px solid #ecceaa;
        }
        .restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #7b583b, 0 6px 10px black;
        }
        .game-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .first-move-box {
            background: #ac8e6b;
            padding: 6px 8px;
            border-radius: 48px;
            box-shadow: inset 0 1px 6px #ffefd1, 0 5px 0 #5e4430;
            display: flex;
            gap: 10px;
        }
        .first-move-box button {
            background: #ecdbba;
            border: none;
            font-size: 1.1rem;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            color: #342918;
            box-shadow: 0 4px 0 #82684d;
            cursor: pointer;
            transition: 0.06s linear;
            border: 1px solid #ffeac6;
            flex: 1;
            white-space: nowrap;
        }
        .first-move-box button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #82684d;
        }
        .first-move-box button.selected {
            background: #f5d798;
            box-shadow: 0 2px 0 #82684d;
            transform: translateY(2px);
            border-color: #ffc107;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            margin: 8px 0 2px;
            touch-action: none;  /* 禁止触摸滚动/缩放 */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #f2e3c6;
            border-radius: 28px;
            box-shadow: inset 0 0 0 2px #b30000, 0 20px 20px rgba(0,0,0,0.4);
            border: 6px solid #664a30;
            cursor: pointer;
            touch-action: none;
        }
        /* 触摸点反馈（移动端显示点击位置） */
        .touch-feedback {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 180, 0.5);
            border: 3px solid #ffaa00;
            box-shadow: 0 0 20px gold;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease;
            z-index: 10;
            opacity: 0;
        }
        .footer-note {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #392f22;
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 8px;
        }
        .footer-note span {
            background: #ac8e6b;
            padding: 4px 16px;
            border-radius: 40px;
            box-shadow: inset 0 1px 5px #fad6a0;
        }
        /* 移动端优化 */
        @media (max-width: 480px) {
            .game-container { padding: 10px; }
            .status-bar { font-size: 1.1rem; padding: 6px 10px; }
            .turn-indicator { font-size: 0.95rem; padding: 4px 12px; }
            .restart-btn { font-size: 1rem; padding: 5px 12px; }
            .first-move-box button { font-size: 0.9rem; padding: 5px 8px; }
            .footer-note { font-size: 0.9rem; gap: 10px; }
            .footer-note span { padding: 3px 10px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⚫ 五子棋 ⚪</h1>
    <div class="status-bar">
        <span class="turn-indicator" id="turnText">玩家回合⚫</span>
        <button class="restart-btn" id="restartBtn">↺ 新一局</button>
    </div>
    <div class="game-panel">
        <div class="first-move-box" id="firstMoveBox">
            <button id="btnPlayerFirst" class="selected">🙋 我先手</button>
            <button id="btnAIFirst">🤖 机器先手</button>
        </div>
    </div>
    <!-- 棋盘canvas包装层，用于绝对定位触摸反馈 -->
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="gobanCanvas" width="550" height="550"></canvas>
        <div class="touch-feedback" id="touchFeedback"></div>
    </div>
    <div class="footer-note">
        <span>⚫ 黑先</span>
        <span>🤖 AI·中阶</span>
    </div>
</div>

<script>
    (function() {
        // ---------- 配置参数 ----------
        const BOARD_SIZE = 15;           // 15x15 标准五子棋
        let board = [];                  // 二维数组 0空 1黑(玩家) 2白(机器)
        let gameOver = false;
        let playerTurn = true;            // true = 玩家(黑棋)回合, false = 机器(白棋)回合
        let playerColor = 1;              // 玩家永远执黑(1)
        let aiColor = 2;                  // 机器永远执白(2)
        let AI_FIRST = false;              // 默认玩家先手
        
        // 记录最新落子位置
        let lastMove = null;               

        const canvas = document.getElementById('gobanCanvas');
        const ctx = canvas.getContext('2d');
        const turnText = document.getElementById('turnText');
        const btnPlayerFirst = document.getElementById('btnPlayerFirst');
        const btnAIFirst = document.getElementById('btnAIFirst');
        const restartBtn = document.getElementById('restartBtn');
        const wrapper = document.getElementById('canvasWrapper');
        const touchFeedback = document.getElementById('touchFeedback');

        // 棋盘格点坐标缓存
        let gridSize = 0;
        let offset = 0;

        // 显示触摸点反馈
        function showTouchFeedback(clientX, clientY) {
            const rect = wrapper.getBoundingClientRect();
            // 计算相对于wrapper的比例位置
            const relativeX = clientX - rect.left;
            const relativeY = clientY - rect.top;
            
            // 边界检查，只在棋盘区域内显示
            if (relativeX >= 0 && relativeX <= rect.width && relativeY >= 0 && relativeY <= rect.height) {
                touchFeedback.style.left = relativeX + 'px';
                touchFeedback.style.top = relativeY + 'px';
                touchFeedback.style.opacity = '1';
                
                // 0.2秒后淡出
                clearTimeout(window.feedbackTimer);
                window.feedbackTimer = setTimeout(() => {
                    touchFeedback.style.opacity = '0';
                }, 200);
            }
        }

        // ---------- 初始化棋盘 ----------
        function initBoard() {
            board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gameOver = false;
            lastMove = null;
            playerTurn = !AI_FIRST;
            
            if (AI_FIRST) {
                turnText.innerText = '机器回合⚪';
            } else {
                turnText.innerText = '玩家回合⚫';
            }
            drawBoard();
            
            if (AI_FIRST && !gameOver) {
                setTimeout(() => machineMove(), 200);
            }
        }

        // ---------- 绘制棋盘 (包含最新手高亮) ----------
        function drawBoard() {
            const dim = canvas.width;
            ctx.clearRect(0, 0, dim, dim);
            
            const margin = Math.floor(dim * 0.06);
            const maxPos = dim - margin;
            gridSize = (maxPos - margin) / (BOARD_SIZE - 1);
            offset = margin;
            
            ctx.fillStyle = '#e8cfaa';
            ctx.fillRect(0, 0, dim, dim);
            
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = '#5f4c3b';
            for (let i = 0; i < BOARD_SIZE; i++) {
                const x = offset + i * gridSize;
                ctx.beginPath();
                ctx.moveTo(x, offset);
                ctx.lineTo(x, offset + (BOARD_SIZE-1) * gridSize);
                ctx.stroke();
            }
            for (let i = 0; i < BOARD_SIZE; i++) {
                const y = offset + i * gridSize;
                ctx.beginPath();
                ctx.moveTo(offset, y);
                ctx.lineTo(offset + (BOARD_SIZE-1) * gridSize, y);
                ctx.stroke();
            }
            
            // 画星位
            const starPoints = [3, 7, 11];
            ctx.fillStyle = '#5f4c3b';
            for (let r of starPoints) {
                for (let c of starPoints) {
                    ctx.beginPath();
                    ctx.arc(offset + r * gridSize, offset + c * gridSize, gridSize*0.12, 0, 2*Math.PI);
                    ctx.fill();
                }
            }
            ctx.beginPath();
            ctx.arc(offset + 3 * gridSize, offset + 11 * gridSize, gridSize*0.12, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(offset + 11 * gridSize, offset + 3 * gridSize, gridSize*0.12, 0, 2*Math.PI);
            ctx.fill();
            
            // 画棋子
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === 0) continue;
                    const x = offset + col * gridSize;
                    const y = offset + row * gridSize;
                    
                    ctx.shadowColor = '#00000055';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    
                    const gradient = ctx.createRadialGradient(x-4, y-4, 3, x, y, gridSize*0.7);
                    if (board[row][col] === 1) {
                        gradient.addColorStop(0, '#333');
                        gradient.addColorStop(0.7, '#111');
                        gradient.addColorStop(1, '#000');
                    } else {
                        gradient.addColorStop(0, '#fafafc');
                        gradient.addColorStop(0.5, '#ddd');
                        gradient.addColorStop(1, '#aaa');
                    }
                    ctx.beginPath();
                    ctx.arc(x, y, gridSize * 0.42, 0, 2 * Math.PI);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    
                    ctx.shadowBlur = 2;
                    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
                    ctx.beginPath();
                    ctx.arc(x-3, y-3, gridSize*0.1, 0, 2*Math.PI);
                    ctx.fillStyle = '#ffffff60';
                    ctx.fill();
                }
            }
            
            // 绘制最新手高亮（红色外圈）
            if (lastMove) {
                const [row, col] = lastMove;
                if (board[row] && board[row][col] !== 0) {
                    const x = offset + col * gridSize;
                    const y = offset + row * gridSize;
                    ctx.shadowColor = '#ff0000aa';
                    ctx.shadowBlur = 14;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, gridSize * 0.5, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ff3333';
                    ctx.lineWidth = gridSize * 0.13;
                    ctx.stroke();
                    
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffaa00';
                    ctx.beginPath();
                    ctx.arc(x, y, gridSize * 0.44, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ffff80';
                    ctx.lineWidth = gridSize * 0.06;
                    ctx.stroke();
                }
            }
            
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        // ---------- 检查五子连线 ----------
        function checkWinner(row, col, color) {
            if (!color) return false;
            const directions = [[1,0],[0,1],[1,1],[1,-1]];
            for (let [dx, dy] of directions) {
                let count = 1;
                for (let step = 1; step < 5; step++) {
                    const nr = row + dx * step, nc = col + dy * step;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || board[nr][nc] !== color) break;
                    count++;
                }
                for (let step = 1; step < 5; step++) {
                    const nr = row - dx * step, nc = col - dy * step;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE || board[nr][nc] !== color) break;
                    count++;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function isBoardFull() {
            for (let row of board) {
                if (row.includes(0)) return false;
            }
            return true;
        }

        function handleGameOver(winner) {
            gameOver = true;
            if (winner === 1) turnText.innerText = '🏆 玩家胜！';
            else if (winner === 2) turnText.innerText = '🤖 机器胜！';
            else turnText.innerText = '🤝 平局';
        }

        // 新增：精确计算触摸点对应的行列，增加容差和最近点吸附
        function getClosestIntersection(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            // 计算在canvas坐标系中的位置
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            
            // 棋盘边界范围（带容差）
            const minBound = offset - gridSize * 0.4;
            const maxBound = offset + (BOARD_SIZE - 1) * gridSize + gridSize * 0.4;
            
            if (canvasX < minBound || canvasX > maxBound || canvasY < minBound || canvasY > maxBound) {
                return null; // 超出触摸容差范围
            }
            
            // 计算理论行列
            const colFloat = (canvasX - offset) / gridSize;
            const rowFloat = (canvasY - offset) / gridSize;
            
            // 四舍五入到最近交叉点
            let col = Math.round(colFloat);
            let row = Math.round(rowFloat);
            
            // 边界保护
            col = Math.max(0, Math.min(BOARD_SIZE - 1, col));
            row = Math.max(0, Math.min(BOARD_SIZE - 1, row));
            
            // 二次验证：距离不能超过格子半径的0.6倍（避免点到格子中间空隙误触）
            const actualX = offset + col * gridSize;
            const actualY = offset + row * gridSize;
            const dist = Math.hypot(canvasX - actualX, canvasY - actualY);
            
            // 如果物理距离超过格子半径的0.7倍，认为是无效点击（防止斜着点偏太远）
            if (dist > gridSize * 0.7) {
                return null;
            }
            
            return { row, col };
        }

        // ---------- 玩家落子 ----------
        function playerMove(row, col) {
            if (!playerTurn || gameOver) return false;
            if (board[row][col] !== 0) return false;
            
            board[row][col] = playerColor;
            lastMove = [row, col];
            drawBoard();
            
            if (checkWinner(row, col, playerColor)) {
                handleGameOver(1);
                return true;
            } else if (isBoardFull()) {
                handleGameOver(0);
                return true;
            }
            
            playerTurn = false;
            turnText.innerText = '机器回合⚪';
            setTimeout(() => machineMove(), 200);
            return true;
        }

        // ---------- 机器AI (同上，保持不变) ----------
        function machineMove() {
            if (gameOver) return;
            if (playerTurn) return;
            
            let empty = [];
            for (let i=0; i<BOARD_SIZE; i++) {
                for (let j=0; j<BOARD_SIZE; j++) {
                    if (board[i][j] === 0) empty.push([i, j]);
                }
            }
            if (empty.length === 0) {
                handleGameOver(0);
                return;
            }
            
            let bestScore = -1;
            let bestMoves = [];
            
            for (let [r, c] of empty) {
                let score = 0;
                score += evaluatePosition(r, c, aiColor) * 1.5;
                score += evaluatePosition(r, c, playerColor) * 1.2;
                
                const center = 7;
                const dist = Math.abs(r-center) + Math.abs(c-center);
                score += (BOARD_SIZE*2 - dist) * 1.5;
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [[r, c]];
                } else if (Math.abs(score - bestScore) < 0.001) {
                    bestMoves.push([r, c]);
                }
            }
            
            if (bestMoves.length === 0) return; 
            const [aiRow, aiCol] = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            
            board[aiRow][aiCol] = aiColor;
            lastMove = [aiRow, aiCol];
            drawBoard();
            
            if (checkWinner(aiRow, aiCol, aiColor)) {
                handleGameOver(2);
                return;
            } else if (isBoardFull()) {
                handleGameOver(0);
                return;
            }
            
            playerTurn = true;
            turnText.innerText = '玩家回合⚫';
        }

        function evaluatePosition(row, col, color) {
            let totalScore = 0;
            const dirs = [[1,0],[0,1],[1,1],[1,-1]];
            
            for (let [dx, dy] of dirs) {
                let count = 1;
                let openLeft = 0, openRight = 0;
                for (let step = 1; step < 5; step++) {
                    const nr = row + dx * step, nc = col + dy * step;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                    if (board[nr][nc] === color) count++;
                    else if (board[nr][nc] === 0) { openRight++; break; }
                    else break;
                }
                for (let step = 1; step < 5; step++) {
                    const nr = row - dx * step, nc = col - dy * step;
                    if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                    if (board[nr][nc] === color) count++;
                    else if (board[nr][nc] === 0) { openLeft++; break; }
                    else break;
                }
                if (count >= 5) totalScore += 10000;
                else if (count === 4) {
                    if (openLeft > 0 || openRight > 0) totalScore += 3000;
                    else totalScore += 1000;
                }
                else if (count === 3) {
                    if (openLeft > 0 && openRight > 0) totalScore += 600;
                    else if (openLeft > 0 || openRight > 0) totalScore += 200;
                }
                else if (count === 2) {
                    if (openLeft > 0 && openRight > 0) totalScore += 80;
                    else if (openLeft > 0 || openRight > 0) totalScore += 20;
                }
                else if (count === 1) totalScore += 2;
            }
            return totalScore;
        }

        // ---------- 触摸/点击处理 (精确优化版) ----------
        function handleCanvasTap(e) {
            e.preventDefault();
            
            // 显示触摸反馈
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            showTouchFeedback(clientX, clientY);
            
            if (gameOver) return;
            if (!playerTurn) {
                // 可选的轻微提示
                return;
            }
            
            const intersection = getClosestIntersection(clientX, clientY);
            if (intersection) {
                playerMove(intersection.row, intersection.col);
            }
        }

        // ---------- 切换先手 ----------
        function setFirstPlayer(isAIFirst) {
            AI_FIRST = isAIFirst;
            btnPlayerFirst.classList.toggle('selected', !AI_FIRST);
            btnAIFirst.classList.toggle('selected', AI_FIRST);
            initBoard();
        }

        // 事件绑定 (同时支持鼠标和触摸)
        canvas.addEventListener('click', handleCanvasTap);
        canvas.addEventListener('touchstart', handleCanvasTap, { passive: false });
        // 阻止touchmove防止页面滑动
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        btnPlayerFirst.addEventListener('click', () => setFirstPlayer(false));
        btnAIFirst.addEventListener('click', () => setFirstPlayer(true));
        restartBtn.addEventListener('click', () => initBoard());

        // 初始化
        initBoard();

        // 窗口resize时重绘
        window.addEventListener('resize', () => { drawBoard(); });
    })();
</script>
</body>
</html>
