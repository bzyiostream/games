<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>五子棋 · 大师级AI</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a3b28 0%, #0f2b1c 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        .game-container {
            max-width: 600px;
            width: 100%;
            background: #e8d5b5;
            background-image: radial-gradient(circle at 25% 30%, #f0e3ce, #dac8a4);
            border-radius: 36px 36px 28px 28px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.6), inset 0 1px 6px #fff3d6;
            padding: 18px 12px 22px;
            border: 2px solid #b49a67;
        }
        h1 {
            text-align: center;
            margin: 0 0 6px 0;
            font-weight: 400;
            font-size: 2rem;
            letter-spacing: 6px;
            color: #2f2216;
            text-shadow: 2px 2px 0 #c9ad7a, 4px 4px 0 #6b4f32;
            font-family: 'Trebuchet MS', 'KaiTi',楷体,serif;
        }
        .status-bar {
            background: #493624;
            border-radius: 60px;
            padding: 10px 16px;
            margin: 8px 0 12px;
            color: #eedbba;
            font-size: 1.4rem;
            font-weight: 600;
            text-align: center;
            box-shadow: inset 0 2px 5px #1f130b, 0 5px 0 #2b1c12;
            border-bottom: 2px solid #7d5f44;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .turn-indicator {
            background: #5f4633;
            padding: 4px 18px;
            border-radius: 40px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #f5e1c4;
            box-shadow: inset 0 -2px 0 #312419;
        }
        .restart-btn {
            background: #cfa668;
            border: none;
            font-size: 1.2rem;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            color: #262216;
            box-shadow: 0 5px 0 #7b583b, 0 6px 10px black;
            cursor: pointer;
            transition: all 0.08s linear;
            border: 1px solid #ecceaa;
        }
        .restart-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #7b583b, 0 6px 10px black;
        }
        .game-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .first-move-box {
            background: #ac8e6b;
            padding: 6px 8px;
            border-radius: 48px;
            box-shadow: inset 0 1px 6px #ffefd1, 0 5px 0 #5e4430;
            display: flex;
            gap: 10px;
        }
        .first-move-box button {
            background: #ecdbba;
            border: none;
            font-size: 1.1rem;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 600;
            color: #342918;
            box-shadow: 0 4px 0 #82684d;
            cursor: pointer;
            transition: 0.06s linear;
            border: 1px solid #ffeac6;
            flex: 1;
            white-space: nowrap;
        }
        .first-move-box button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #82684d;
        }
        .first-move-box button.selected {
            background: #f5d798;
            box-shadow: 0 2px 0 #82684d;
            transform: translateY(2px);
            border-color: #ffc107;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            margin: 8px 0 2px;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #f2e3c6;
            border-radius: 28px;
            box-shadow: inset 0 0 0 2px #b30000, 0 20px 20px rgba(0,0,0,0.4);
            border: 6px solid #664a30;
            cursor: pointer;
            touch-action: none;
        }
        .touch-feedback {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 180, 0.5);
            border: 3px solid #ffaa00;
            box-shadow: 0 0 20px gold;
            pointer-events: none;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease;
            z-index: 10;
            opacity: 0;
        }
        .footer-note {
            display: flex;
            justify-content: center;
            gap: 20px;
            color: #392f22;
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 8px;
        }
        .footer-note span {
            background: #ac8e6b;
            padding: 4px 16px;
            border-radius: 40px;
            box-shadow: inset 0 1px 5px #fad6a0;
        }
        @media (max-width: 480px) {
            .game-container { padding: 10px; }
            .status-bar { font-size: 1.1rem; padding: 6px 10px; }
            .turn-indicator { font-size: 0.95rem; padding: 4px 12px; }
            .restart-btn { font-size: 1rem; padding: 5px 12px; }
            .first-move-box button { font-size: 0.9rem; padding: 5px 8px; }
            .footer-note { font-size: 0.9rem; gap: 10px; }
            .footer-note span { padding: 3px 10px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⚫ 五子棋 ⚪</h1>
    <div class="status-bar">
        <span class="turn-indicator" id="turnText">玩家回合⚫</span>
        <button class="restart-btn" id="restartBtn">↺ 新一局</button>
    </div>
    <div class="game-panel">
        <div class="first-move-box" id="firstMoveBox">
            <button id="btnPlayerFirst" class="selected">🙋 我先手</button>
            <button id="btnAIFirst">🤖 大师先手</button>
        </div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="gobanCanvas" width="550" height="550"></canvas>
        <div class="touch-feedback" id="touchFeedback"></div>
    </div>
    <div class="footer-note">
        <span>⚫ 黑先</span>
        <span>🤖 大师·深度搜索</span>
    </div>
</div>

<script>
    (function() {
        // ---------- 配置参数 ----------
        const BOARD_SIZE = 15;
        let board = [];
        let gameOver = false;
        let playerTurn = true;
        let playerColor = 1;
        let aiColor = 2;
        let AI_FIRST = false;
        
        let lastMove = null;

        const canvas = document.getElementById('gobanCanvas');
        const ctx = canvas.getContext('2d');
        const turnText = document.getElementById('turnText');
        const btnPlayerFirst = document.getElementById('btnPlayerFirst');
        const btnAIFirst = document.getElementById('btnAIFirst');
        const restartBtn = document.getElementById('restartBtn');
        const wrapper = document.getElementById('canvasWrapper');
        const touchFeedback = document.getElementById('touchFeedback');

        let gridSize = 0;
        let offset = 0;

        // ---------- 大师级AI：增强的棋型评估 + 深度2层搜索 ----------
        // 棋型评分表 (基于颜色)
        const SCORE = {
            FIVE: 1000000,      // 连五
            LIVE_FOUR: 100000,   // 活四
            SLEEP_FOUR: 10000,   // 冲四
            LIVE_THREE: 8000,    // 活三
            SLEEP_THREE: 1500,   // 眠三
            LIVE_TWO: 800,       // 活二
            SLEEP_TWO: 200,      // 眠二
            LIVE_ONE: 20,
            SLEEP_ONE: 5
        };

        // 方向向量
        const DIRS = [[1,0],[0,1],[1,1],[1,-1]];

        // 评估单方向上的棋型
        function evaluateDirection(board, r, c, color, dr, dc) {
            let count = 1; // 当前棋子
            let leftEmpty = 0, rightEmpty = 0;
            let leftBlocked = false, rightBlocked = false;
            
            // 正方向
            for (let step = 1; step < 5; step++) {
                const nr = r + dr * step, nc = c + dc * step;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) {
                    rightBlocked = true;
                    break;
                }
                if (board[nr][nc] === color) {
                    count++;
                } else if (board[nr][nc] === 0) {
                    rightEmpty++;
                    break;
                } else {
                    rightBlocked = true;
                    break;
                }
            }
            
            // 负方向
            for (let step = 1; step < 5; step++) {
                const nr = r - dr * step, nc = c - dc * step;
                if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) {
                    leftBlocked = true;
                    break;
                }
                if (board[nr][nc] === color) {
                    count++;
                } else if (board[nr][nc] === 0) {
                    leftEmpty++;
                    break;
                } else {
                    leftBlocked = true;
                    break;
                }
            }
            
            // 根据连续棋子数量和空位/阻挡情况返回分数
            if (count >= 5) return SCORE.FIVE;
            
            // 活四: 四个连续且两边都空
            if (count === 4) {
                if (!leftBlocked && !rightBlocked && leftEmpty > 0 && rightEmpty > 0) return SCORE.LIVE_FOUR;
                if ((!leftBlocked && leftEmpty > 0) || (!rightBlocked && rightEmpty > 0)) return SCORE.SLEEP_FOUR;
            }
            
            // 活三: 三个连续且两边都空
            if (count === 3) {
                if (!leftBlocked && !rightBlocked && leftEmpty > 0 && rightEmpty > 0) return SCORE.LIVE_THREE;
                if ((!leftBlocked && leftEmpty > 0) || (!rightBlocked && rightEmpty > 0)) return SCORE.SLEEP_THREE;
            }
            
            // 活二
            if (count === 2) {
                if (!leftBlocked && !rightBlocked && leftEmpty > 0 && rightEmpty > 0) return SCORE.LIVE_TWO;
                if ((!leftBlocked && leftEmpty > 0) || (!rightBlocked && rightEmpty > 0)) return SCORE.SLEEP_TWO;
            }
            
            // 活一
            if (count === 1) {
                if (!leftBlocked && !rightBlocked && leftEmpty > 0 && rightEmpty > 0) return SCORE.LIVE_ONE;
                if ((!leftBlocked && leftEmpty > 0) || (!rightBlocked && rightEmpty > 0)) return SCORE.SLEEP_ONE;
            }
            
            return 0;
        }

        // 评估整个棋盘上某个颜色的总分数 (用于启发)
        function evaluateColor(board, color) {
            let total = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] !== color) continue;
                    for (let d of DIRS) {
                        total += evaluateDirection(board, r, c, color, d[0], d[1]);
                    }
                }
            }
            return total;
        }

        // 评估某个空位如果下color能得到多少分 (快速启发)
        function evaluateMove(board, r, c, color) {
            if (board[r][c] !== 0) return 0;
            let score = 0;
            for (let d of DIRS) {
                score += evaluateDirection(board, r, c, color, d[0], d[1]);
            }
            return score;
        }

        // 获取候选位置: 已有棋子的邻域(距离<=2)
        function getCandidateMoves(board) {
            const moves = [];
            const used = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(false));
            
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] !== 0) {
                        // 标记周围2格内
                        for (let dr = -2; dr <= 2; dr++) {
                            for (let dc = -2; dc <= 2; dc++) {
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0 && !used[nr][nc]) {
                                    used[nr][nc] = true;
                                    moves.push([nr, nc]);
                                }
                            }
                        }
                    }
                }
            }
            
            // 如果棋盘全空，返回中心点
            if (moves.length === 0) {
                moves.push([7, 7]);
            }
            return moves;
        }

        // 极小极大搜索 (深度2层: AI下->玩家下->评估)
        function minimax(board, depth, maximizingPlayer) {
            if (depth === 0) {
                // 评估当前局面对AI的有利程度: AI分 - 玩家分
                const aiScore = evaluateColor(board, aiColor);
                const playerScore = evaluateColor(board, playerColor);
                return aiScore - playerScore;
            }
            
            const candidates = getCandidateMoves(board);
            if (candidates.length === 0) return 0;
            
            if (maximizingPlayer) {
                let maxEval = -Infinity;
                for (let [r, c] of candidates) {
                    if (board[r][c] !== 0) continue;
                    board[r][c] = aiColor;
                    const evalScore = minimax(board, depth - 1, false);
                    board[r][c] = 0;
                    maxEval = Math.max(maxEval, evalScore);
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let [r, c] of candidates) {
                    if (board[r][c] !== 0) continue;
                    board[r][c] = playerColor;
                    const evalScore = minimax(board, depth - 1, true);
                    board[r][c] = 0;
                    minEval = Math.min(minEval, evalScore);
                }
                return minEval;
            }
        }

        // AI大师级下棋
        function masterAIMove() {
            if (gameOver) return;
            if (playerTurn) return;
            
            const candidates = getCandidateMoves(board);
            if (candidates.length === 0) {
                handleGameOver(0);
                return;
            }
            
            let bestScore = -Infinity;
            let bestMoves = [];
            
            // 第一层：AI下棋
            for (let [r, c] of candidates) {
                if (board[r][c] !== 0) continue;
                
                // 启发式剪枝: 先快速算一下这个点的进攻+防守分，低于阈值的直接跳过（优化速度）
                const quickScore = evaluateMove(board, r, c, aiColor) * 1.5 + evaluateMove(board, r, c, playerColor) * 1.2;
                if (quickScore < 500 && candidates.length > 15) continue; // 粗略剪枝
                
                board[r][c] = aiColor;
                
                // 检查AI直接获胜
                let win = false;
                for (let d of DIRS) {
                    if (evaluateDirection(board, r, c, aiColor, d[0], d[1]) >= SCORE.FIVE) {
                        win = true;
                        break;
                    }
                }
                if (win) {
                    board[r][c] = 0; // 恢复后记录
                    bestMoves = [[r, c]];
                    bestScore = SCORE.FIVE;
                    break;
                }
                
                // 深度2搜索 (玩家最佳应对)
                const score = minimax(board, 1, false); // depth=1 相当于再搜索玩家一步
                board[r][c] = 0;
                
                if (score > bestScore) {
                    bestScore = score;
                    bestMoves = [[r, c]];
                } else if (Math.abs(score - bestScore) < 0.1) {
                    bestMoves.push([r, c]);
                }
            }
            
            if (bestMoves.length === 0) {
                // 保底：随便选一个
                bestMoves = candidates;
            }
            
            const [aiRow, aiCol] = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            
            board[aiRow][aiCol] = aiColor;
            lastMove = [aiRow, aiCol];
            drawBoard();
            
            if (checkWinner(aiRow, aiCol, aiColor)) {
                handleGameOver(2);
                return;
            } else if (isBoardFull()) {
                handleGameOver(0);
                return;
            }
            
            playerTurn = true;
            turnText.innerText = '玩家回合⚫';
        }

        // 保持原有的检查胜利函数 (使用evaluateDirection辅助)
        function checkWinner(row, col, color) {
            for (let d of DIRS) {
                if (evaluateDirection(board, row, col, color, d[0], d[1]) >= SCORE.FIVE) {
                    return true;
                }
            }
            return false;
        }

        function isBoardFull() {
            for (let row of board) {
                if (row.includes(0)) return false;
            }
            return true;
        }

        function handleGameOver(winner) {
            gameOver = true;
            if (winner === 1) turnText.innerText = '🏆 玩家胜！';
            else if (winner === 2) turnText.innerText = '🤖 大师胜！';
            else turnText.innerText = '🤝 平局';
        }

        // ---------- 绘制函数 (不变) ----------
        function drawBoard() {
            const dim = canvas.width;
            ctx.clearRect(0, 0, dim, dim);
            
            const margin = Math.floor(dim * 0.06);
            const maxPos = dim - margin;
            gridSize = (maxPos - margin) / (BOARD_SIZE - 1);
            offset = margin;
            
            ctx.fillStyle = '#e8cfaa';
            ctx.fillRect(0, 0, dim, dim);
            
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = '#5f4c3b';
            for (let i = 0; i < BOARD_SIZE; i++) {
                const x = offset + i * gridSize;
                ctx.beginPath();
                ctx.moveTo(x, offset);
                ctx.lineTo(x, offset + (BOARD_SIZE-1) * gridSize);
                ctx.stroke();
            }
            for (let i = 0; i < BOARD_SIZE; i++) {
                const y = offset + i * gridSize;
                ctx.beginPath();
                ctx.moveTo(offset, y);
                ctx.lineTo(offset + (BOARD_SIZE-1) * gridSize, y);
                ctx.stroke();
            }
            
            const starPoints = [3, 7, 11];
            ctx.fillStyle = '#5f4c3b';
            for (let r of starPoints) {
                for (let c of starPoints) {
                    ctx.beginPath();
                    ctx.arc(offset + r * gridSize, offset + c * gridSize, gridSize*0.12, 0, 2*Math.PI);
                    ctx.fill();
                }
            }
            ctx.beginPath();
            ctx.arc(offset + 3 * gridSize, offset + 11 * gridSize, gridSize*0.12, 0, 2*Math.PI);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(offset + 11 * gridSize, offset + 3 * gridSize, gridSize*0.12, 0, 2*Math.PI);
            ctx.fill();
            
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] === 0) continue;
                    const x = offset + col * gridSize;
                    const y = offset + row * gridSize;
                    
                    ctx.shadowColor = '#00000055';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 2;
                    ctx.shadowOffsetY = 2;
                    
                    const gradient = ctx.createRadialGradient(x-4, y-4, 3, x, y, gridSize*0.7);
                    if (board[row][col] === 1) {
                        gradient.addColorStop(0, '#333');
                        gradient.addColorStop(0.7, '#111');
                        gradient.addColorStop(1, '#000');
                    } else {
                        gradient.addColorStop(0, '#fafafc');
                        gradient.addColorStop(0.5, '#ddd');
                        gradient.addColorStop(1, '#aaa');
                    }
                    ctx.beginPath();
                    ctx.arc(x, y, gridSize * 0.42, 0, 2 * Math.PI);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    
                    ctx.shadowBlur = 2;
                    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
                    ctx.beginPath();
                    ctx.arc(x-3, y-3, gridSize*0.1, 0, 2*Math.PI);
                    ctx.fillStyle = '#ffffff60';
                    ctx.fill();
                }
            }
            
            if (lastMove) {
                const [row, col] = lastMove;
                if (board[row] && board[row][col] !== 0) {
                    const x = offset + col * gridSize;
                    const y = offset + row * gridSize;
                    ctx.shadowColor = '#ff0000aa';
                    ctx.shadowBlur = 14;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, gridSize * 0.5, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ff3333';
                    ctx.lineWidth = gridSize * 0.13;
                    ctx.stroke();
                    
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffaa00';
                    ctx.beginPath();
                    ctx.arc(x, y, gridSize * 0.44, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#ffff80';
                    ctx.lineWidth = gridSize * 0.06;
                    ctx.stroke();
                }
            }
            
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        // ---------- 玩家操作 (不变) ----------
        function playerMove(row, col) {
            if (!playerTurn || gameOver) return false;
            if (board[row][col] !== 0) return false;
            
            board[row][col] = playerColor;
            lastMove = [row, col];
            drawBoard();
            
            if (checkWinner(row, col, playerColor)) {
                handleGameOver(1);
                return true;
            } else if (isBoardFull()) {
                handleGameOver(0);
                return true;
            }
            
            playerTurn = false;
            turnText.innerText = '大师回合⚪';
            setTimeout(() => masterAIMove(), 200);
            return true;
        }

        // 触摸处理
        function showTouchFeedback(clientX, clientY) {
            const rect = wrapper.getBoundingClientRect();
            const relativeX = clientX - rect.left;
            const relativeY = clientY - rect.top;
            
            if (relativeX >= 0 && relativeX <= rect.width && relativeY >= 0 && relativeY <= rect.height) {
                touchFeedback.style.left = relativeX + 'px';
                touchFeedback.style.top = relativeY + 'px';
                touchFeedback.style.opacity = '1';
                
                clearTimeout(window.feedbackTimer);
                window.feedbackTimer = setTimeout(() => {
                    touchFeedback.style.opacity = '0';
                }, 200);
            }
        }

        function getClosestIntersection(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            
            const minBound = offset - gridSize * 0.4;
            const maxBound = offset + (BOARD_SIZE - 1) * gridSize + gridSize * 0.4;
            
            if (canvasX < minBound || canvasX > maxBound || canvasY < minBound || canvasY > maxBound) {
                return null;
            }
            
            const colFloat = (canvasX - offset) / gridSize;
            const rowFloat = (canvasY - offset) / gridSize;
            
            let col = Math.round(colFloat);
            let row = Math.round(rowFloat);
            
            col = Math.max(0, Math.min(BOARD_SIZE - 1, col));
            row = Math.max(0, Math.min(BOARD_SIZE - 1, row));
            
            const actualX = offset + col * gridSize;
            const actualY = offset + row * gridSize;
            const dist = Math.hypot(canvasX - actualX, canvasY - actualY);
            
            if (dist > gridSize * 0.7) return null;
            
            return { row, col };
        }

        function handleCanvasTap(e) {
            e.preventDefault();
            
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            showTouchFeedback(clientX, clientY);
            
            if (gameOver) return;
            if (!playerTurn) return;
            
            const intersection = getClosestIntersection(clientX, clientY);
            if (intersection) {
                playerMove(intersection.row, intersection.col);
            }
        }

        function setFirstPlayer(isAIFirst) {
            AI_FIRST = isAIFirst;
            btnPlayerFirst.classList.toggle('selected', !AI_FIRST);
            btnAIFirst.classList.toggle('selected', AI_FIRST);
            initBoard();
        }

        function initBoard() {
            board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(0));
            gameOver = false;
            lastMove = null;
            playerTurn = !AI_FIRST;
            
            if (AI_FIRST) {
                turnText.innerText = '大师回合⚪';
            } else {
                turnText.innerText = '玩家回合⚫';
            }
            drawBoard();
            
            if (AI_FIRST && !gameOver) {
                setTimeout(() => masterAIMove(), 200);
            }
        }

        // 事件绑定
        canvas.addEventListener('click', handleCanvasTap);
        canvas.addEventListener('touchstart', handleCanvasTap, { passive: false });
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        btnPlayerFirst.addEventListener('click', () => setFirstPlayer(false));
        btnAIFirst.addEventListener('click', () => setFirstPlayer(true));
        restartBtn.addEventListener('click', () => initBoard());

        initBoard();

        window.addEventListener('resize', () => { drawBoard(); });
    })();
</script>
</body>
</html>
